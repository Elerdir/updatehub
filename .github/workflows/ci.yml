name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore src/UpdateHub.Web/UpdateHub.Web.csproj

      - name: Build
        run: dotnet build src/UpdateHub.Web/UpdateHub.Web.csproj --no-restore -c Release

      - name: Publish
        run: dotnet publish src/UpdateHub.Web/UpdateHub.Web.csproj --no-build -c Release -o ./publish
