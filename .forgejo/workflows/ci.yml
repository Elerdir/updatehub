name: CI

# Forgejo Actions na vlastnim runneru (NUC). Image jde do registru Forgejo
# git.niderle.cz/elerdir/updatehub (nahrada GHCR). Jen linux/amd64 - NUC je x86.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore UpdateHub.sln

      - name: Build
        run: dotnet build UpdateHub.sln --no-restore -c Release

      - name: Test
        run: dotnet test UpdateHub.sln --no-build -c Release --logger "console;verbosity=minimal"

  image:
    name: Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    env:
      IMAGE: git.niderle.cz/elerdir/updatehub
      SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prihlaseni do registru Forgejo
        # REGISTRY_TOKEN = token uzivatele ladislav s opravnenim package:write (tajemstvi organizace).
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.niderle.cz -u ladislav --password-stdin

      - name: Build
        run: |
          # Tag vX.Y.Z -> image X.Y.Z; push do main -> latest.
          case "$GITHUB_REF" in
            refs/tags/v*) TAGS="-t $IMAGE:${REF_NAME#v}" ;;
            *)            TAGS="-t $IMAGE:latest" ;;
          esac
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"
          docker build $TAGS -t "$IMAGE:sha-$SHA" .

      - name: Push
        run: |
          docker push "$IMAGE:sha-$SHA"
          for t in $TAGS; do [ "$t" = "-t" ] || docker push "$t"; done
